/* ── Temes Guaita (paleta guaitaPDF Edit) ── */
:root{--bg:#0E1116;--bg-deep:#0B0D10;--bg-panel:#171B21;--bg-surface:#1E232B;--bg-control:#1E232B;--bg-hover:#252B34;
 --border:#2A313B;--border-strong:#4A5361;--text:#E7EAEE;--text-soft:#DDE1E6;--text-mut:#8B939F;--text-dim2:#5C6470;
 --accent:#D6FB41;--accent-line:#D6FB41;--accent-text:#D6FB41;--on-accent:#1A2000;--accent-soft:rgba(214,251,65,.08);--accent-soft2:rgba(214,251,65,.18);
 --danger:#FF5E5E;--green:#6EE7A8;--op:#1F2A0C;
 --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;--font-disp:var(--font-num)}
body.light{--bg:#F4F5F7;--bg-deep:#ECEEF1;--bg-panel:#FFFFFF;--bg-surface:#F1F3F5;--bg-control:#FFFFFF;--bg-hover:#E9ECF0;
 --border:#D5DAE0;--border-strong:#9AA3AE;--text:#161A20;--text-soft:#23282F;--text-mut:#5C6470;--text-dim2:#8B939F;
 --accent:#D6FB41;--accent-line:#8DB300;--accent-text:#5E7700;--on-accent:#1A2000;--accent-soft:rgba(141,179,0,.10);--accent-soft2:rgba(141,179,0,.22);
 --danger:#D93636;--green:#2E8A57;--op:#EEF6D0}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
.mono,.v,#ex,#pv,.stk,.hi,.inp input{font-family:var(--font-num)}
/* ── Capçalera i menús ── */
#app-header{display:flex;align-items:center;gap:10px;padding:7px 14px 6px;background:var(--bg-deep);border-bottom:2px solid var(--accent-line);flex:none;position:relative;z-index:150}
.brand{display:flex;align-items:center;gap:8px;font:900 17px 'Arial Black',system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-text);white-space:nowrap}
.brand small{font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--text-mut)}
.cells{display:grid;grid-template-columns:7px 7px;gap:2px;flex:none}
.cells i{display:block;width:7px;height:7px}
.cells i:nth-child(1){background:#D6FB41}.cells i:nth-child(2){background:#FF2ECC}.cells i:nth-child(3){background:#00E5FF}.cells i:nth-child(4){background:#FFE500}
#app-menus{display:flex;gap:1px;margin-left:4px}
.menu{position:relative}
.menu-btn{border:1px solid transparent;color:var(--text-soft);font:600 12px var(--font-ui);letter-spacing:.5px;padding:5px 11px;border-radius:4px}
.menu-btn:hover,.menu.open>.menu-btn{background:var(--bg-hover);border-color:var(--border-strong);color:var(--accent-text)}
.menu-list{display:none;position:absolute;top:100%;left:0;margin-top:4px;min-width:250px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:6px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.menu.open>.menu-list{display:block}
.mi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:18px;padding:6px 10px;border-radius:4px;font-size:13px;text-align:left;position:relative;cursor:pointer}
.mi>span:first-child{display:flex;align-items:center;gap:8px}
.mi:hover:not(:disabled){background:var(--accent-soft2);color:var(--accent-text)}
.mi:disabled{opacity:.35;cursor:not-allowed}
.mi kbd{font:10px 'IBM Plex Mono',monospace;color:var(--text-dim2)}
.mi .ar{color:var(--text-mut);font-size:11px}
.sub{top:-5px;left:100%;margin:0 0 0 2px;color:var(--text)}
.mi.has:hover,.mi.has.open{background:var(--accent-soft);color:var(--accent-text)}
.mi.has:hover>.sub,.mi.has.open>.sub{display:block}
.msep{height:1px;background:var(--border);margin:4px 2px}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
.ic.chk{color:var(--accent-text);font-size:13px;line-height:15px;text-align:center}
#hamb{display:none;font-size:20px;padding:0 6px;color:var(--text-soft)}
#app-header .sp{flex:1}
.chip{border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--text-soft)}
.chip.on{border-color:var(--accent-line);color:var(--accent-text)}
/* ── Disposició ── */
main{flex:1;display:grid;grid-template-columns:270px 1fr 390px;min-height:0}
section{min-height:0;overflow:auto;border-right:1px solid var(--border)}
#right{display:flex;flex-direction:column;border-right:0;background:var(--bg-panel)}
#lib{padding:10px;background:var(--bg-panel)}
#q{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-control);margin-bottom:6px}
.cat{color:var(--accent-text);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:12px 4px 4px}
.fi{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:5px;font-size:14px}
.fi:hover{background:var(--bg-hover)}.fi.on{background:var(--accent-soft2);color:var(--accent-text)}
/* ── Formulari ── */
#form{padding:16px 22px}
#form h2{font-size:19px;font-weight:600;margin-bottom:2px}
.ref{color:var(--text-mut);font-size:12.5px;margin-bottom:12px}
.svg{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:12px;text-align:center}
.svg svg{max-width:100%;height:auto;max-height:130px}
.inp{display:grid;grid-template-columns:1fr 130px 84px;gap:8px;align-items:center;margin:6px 0}
.inp input,.inp select,.dbbox input,.dbbox select{width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-control)}
.inp input{text-align:right}
.inp input:focus,.inp select:focus,#q:focus{outline:none;border-color:var(--accent-line)}
.inp select.wide{grid-column:span 2}
.ub{border:1px solid var(--border);border-radius:6px;padding:5px 4px;font-size:12.5px;color:var(--text-mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub:not(.fix):hover{border-color:var(--accent-line);color:var(--accent-text)}
.ub.fix{border-color:transparent;cursor:default;text-align:left}
.res{margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
.ro{display:grid;grid-template-columns:1fr auto 84px 32px;gap:8px;align-items:center;padding:4px 0}
.ro small{color:var(--text-mut)}
.ro .v{font-weight:600;color:var(--accent-text);text-align:right}
.ro .v.ko{color:var(--danger)}
.to{border:1px solid var(--border);border-radius:6px;font-size:12px;padding:4px 0}
.to:hover{border-color:var(--accent-line);color:var(--accent-text)}
.acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent-line);color:var(--accent-text);border-radius:6px;padding:6px 12px;font-size:13px}
.btn:hover{background:var(--accent-soft2)}
.hint{margin-top:10px;font-size:12px;color:var(--text-dim2)}

  const ASPR = [[0.156, 0.003, 1], [0.17, 0.01, 1], [0.19, 0.05, 2], [0.22, 0.3, 5], [0.24, 1, 10]]; // k, L, Z · taula D.2 DB-SE-AE (còpia 2009)

// ---------- Algebraica ----------
function preview() {
  $('#ex').textContent = expr; const pv = $('#pv'); pv.classList.remove('big');
  if (!expr) { pv.textContent = ''; return; }
  try { pv.textContent = '= ' + Core.fmt(EV(expr)); } catch { pv.textContent = ''; }
}
function keyAlg(k) {
  if (k === 'CLR') { expr = ''; justEq = false; }
  else if (k === 'BS') expr = expr.replace(/([a-z]+\(|√\(|Ans|.)$/, '');
  else if (k === 'EQ') {
    if (!expr) return;
    try { const r = EV(expr); if (!isFinite(r)) throw Error();
      S.hist.unshift({ e: expr, r }); S.ans = r; drawHist(); tapePush(expr, r); save(); $('#ex').textContent = expr; $('#pv').classList.add('big'); $('#pv').textContent = Core.fmt(r); expr = Core.fmt(r); justEq = true; return;
    } catch { $('#pv').classList.add('big'); $('#pv').textContent = 'Error'; return; }
  } else { if (justEq && /^([0-9.(π√]|[a-zA-Z])/.test(k)) expr = ''; expr += k; justEq = false; }
  preview();
}
function insertVal(x, ex) {
  const s = ex ? exact(x) : Core.fmt(x);
  if (S.mode === 'alg') { if (justEq) expr = ''; expr += (expr && /[0-9)πs]$/.test(expr) ? '×' : '') + s; justEq = false; preview(); }
  else { commitEntry(); S.stack.push(x); drawStack(); save(); }
  view('calc');
}

// ---------- RPN ----------
function commitEntry() { if (S.entry !== '') { const n = Number(S.entry); if (!isNaN(n)) S.stack.push(n); S.entry = ''; } }
function keyRpn(k) {
  if (/^[0-9.]$/.test(k)) { if (k === '.' && S.entry.includes('.')) return; S.entry += k; }
  else if (k === 'BS') { if (S.entry) S.entry = S.entry.slice(0, -1); else S.stack.pop(); }
  else if (k === 'CLR') { S.entry = ''; S.stack = []; }
  else if (k === 'ENT') { if (S.entry !== '') commitEntry(); else S.stack = Core.rpn(S.stack, 'dup'); }
  else if (k === 'chs' && S.entry) S.entry = S.entry.startsWith('-') ? S.entry.slice(1) : '-' + S.entry;
  else { commitEntry(); const need = ['+', '-', '*', '/', '^', 'swap', 'mod', 'ncr', 'npr'].includes(k) ? 2 : 1; if (S.stack.length < need) { drawStack(); return; }
    const top = S.stack.slice(-need); S.stack = Core.rpn(S.stack, k, { angle: S.angle });
    if (k !== 'swap' && k !== 'drop') { const r = S.stack[S.stack.length - 1]; const e = 'RPN ' + top.map(Core.fmt).join(' ') + ' ' + k; S.hist.unshift({ e, r }); S.ans = r; drawHist(); tapePush(e, r); } }
  drawStack(); save();
}
function drawStack() {
  const vis = S.stack.slice(); if (S.entry !== '') vis.push(S.entry);
  $('#dRpn').innerHTML = ['T', 'Z', 'Y', 'X'].map((l, i) => { const v = vis[vis.length - 4 + i];
    return `<div><span>${l}</span><span>${v === undefined ? '' : esc(typeof v === 'number' ? Core.fmt(v) : v)}</span></div>`; }).join('');
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const hay = f => norm([f.n, t(f.n), f.cat, t(f.cat), f.sub || '', t(f.sub || ''), f.ref || '', t(f.ref || ''), f.kw || '', f.cte || ''].join(' '));
const itemBtn = f => `<button class="fi${f.id === S.fid ? ' on' : ''}" data-id="${f.id}"><span>${esc(t(f.n))}</span>${S.fav.includes(f.id) ? '<i class="st">★</i>' : ''}</button>`;
function drawList() {
  const q = norm($('#q').value.trim()), ws = q.split(/\s+/).filter(Boolean), srch = ws.length > 0, keys = [];
  const hit = f => !srch || ws.every(w => hay(f).includes(w));
  const det = (key, title, body, n) => { keys.push(key); return `<details data-k="${esc(key)}"${srch || S.open[key] ? ' open' : ''}><summary>${esc(t(title))}<small>${n}</small></summary><div class="dbody">${body}</div></details>`; };
  let h = '';
  if (!srch) {
    const fv_ = S.fav.map(findItem).filter(Boolean), rc = S.rec.map(findItem).filter(Boolean);
    if (fv_.length) h += det('fav', '★ Preferides', fv_.map(itemBtn).join(''), fv_.length);
    if (rc.length) h += det('rec', 'Recents', rc.map(itemBtn).join(''), rc.length);
  }
  let total = 0;
  for (const c of chapters()) {
    const subs = c.subs.map(q2 => ({ ...q2, items: q2.items.filter(hit) })).filter(q2 => q2.items.length); if (!subs.length) continue;
    const n = subs.reduce((a, q2) => a + q2.items.length, 0); total += n;
    const body = subs.length === 1 && !subs[0].t ? subs[0].items.map(itemBtn).join('') : subs.map(q2 => q2.t ? det(c.key + '/' + q2.t, q2.t, q2.items.map(itemBtn).join(''), q2.items.length) : q2.items.map(itemBtn).join('')).join('');
    h += det(c.key, c.t, body, n);
  }
  $('#list').innerHTML = h && total ? h : (h || `<div class="empty">${t('Cap resultat')}</div>`);
  $('#list')._keys = keys;
}

    const tg = Core.toBase(num(SVS.tgt), ro.d, uo), lo = Core.toBase(num(SVS.lo), iv.d, u), hi = Core.toBase(num(SVS.hi), iv.d, u);

}
const lastUnit = (f, j) => { try { const r = Core.runFormula(f, baseVals(f))[j], u = S.outU[f.id + '.' + j] || 0; return Core.unitName(r.d, u, r.u || ''); } catch { return ''; } };

// ---------- Gràfica de funcions ----------
function grInit() { const g = S.gr = S.gr || {}; g.fs = (g.fs || ['sin(x)', 'x^2/10', '', '']).concat(['', '', '', '']).slice(0, 4); if (g.x0 === undefined || !(g.x1 > g.x0)) { g.x0 = -10; g.x1 = 10; } if (g.marks === undefined) g.marks = true; return g; }
function grFns() { const g = S.gr, out = []; g.fs.forEach((e, i) => { if (!e.trim()) return; try { out.push({ i, e, fn: cmp(e.replace(/^\s*f\d?\s*\(x\)\s*=/, '')) }); } catch { out.push({ i, e, bad: true }); } }); return out; }
function grAuto() { const g = S.gr, ys = []; for (const f of grFns()) if (f.fn) for (let k = 0; k <= 200; k++) { const y = f.fn(g.x0 + (g.x1 - g.x0) * k / 200); if (isFinite(y)) ys.push(y); }

    Core.findRoots(x => (f.fn(x + h) - f.fn(x - h)) / (2 * h), g.x0, g.x1, { n: 400 }).forEach(r => { const y = f.fn(r.x), c = (f.fn(r.x + 1e3 * h) + f.fn(r.x - 1e3 * h) - 2 * y); add(r.x, y, 'e', `f${f.i + 1}: ${c > 0 ? t('mínim') : t('màxim')} (${Core.fmtR(r.x)}; ${Core.fmtR(y)})`); }); }
  for (let a = 0; a < F.length; a++) for (let b = a + 1; b < F.length; b++) if (F[a].fn && F[b].fn) Core.findRoots(x => F[a].fn(x) - F[b].fn(x), g.x0, g.x1, { n: 400 }).forEach(r => add(r.x, F[a].fn(r.x), 'i', `f${F[a].i + 1}∩f${F[b].i + 1}: (${Core.fmtR(r.x)}; ${Core.fmtR(F[a].fn(r.x))})`));
  return M; }
const grSeries = (F, n, g = S.gr) => [...F.filter(f => f.fn).map(f => ({ name: `f${f.i + 1}`, col: COLS[f.i], pts: Array.from({ length: n + 1 }, (_, k) => { const x = g.x0 + (g.x1 - g.x0) * k / n; let y; try { y = f.fn(x); } catch { y = NaN; } return [x, y]; }) })), ...(g.data || []).map((d, i) => ({ ...d, col: COLS[(F.length + i) % 4] }))];
function grSVG(opt = {}) { const g = S.gr, F = opt.F || grFns(), marks = g.marks && !opt.fast ? grMarks(F) : [];
  const MC = { r: '#ff6b9d', e: '#ffd23f', i: '#7bd88f' };
  grLast = { marks, F };
  return plotSVG(grSeries(F, opt.n || 500), { x0: g.x0, x1: g.x1, y0: g.y0, y1: g.y1, xl: 'x', marks: marks.map(m => ({ ...m, col: opt.fg ? '#c00' : MC[m.k] })), ...(opt.fg ? { bg: '#fff', fg: '#111' } : {}) }); }
let grLast = { marks: [] };
function graphUI() {
  const g = grInit(); const F0 = grFns(); if (g.y0 === undefined || !(g.y1 > g.y0)) grAuto();
  $('#tb').innerHTML = `<div class="gfs">${g.fs.map((e, i) => `<label><i style="background:${COLS[i]}"></i>f${i + 1}(x)=<input class="gfi" data-i="${i}" value="${esc(e)}"></label>`).join('')}</div>
   <div class="gplot" id="gp"></div><div class="hint" id="gh"></div>
   <div class="acts"><button class="btn" id="gAuto">${t('Ajusta Y')}</button><button class="btn" id="gRst">${t('Reinicia')}</button><button class="btn${g.marks ? ' on' : ''}" id="gMk">${t('Arrels / extrems / talls')}</button><button class="btn" id="gTab">${t('Taula')}</button></div>
   <div class="acts"><button class="btn" id="gSvg">SVG</button><button class="btn" id="gPng">PNG</button><button class="btn" id="gCsv">CSV</button>${g.data && g.data.length ? `<button class="btn" id="gDat">${t('Treu les dades')}</button>` : ''}</div><div id="gm"></div><div id="gt"></div>`;

  $('#gSvg').onclick = () => dlSVG('guaitaCalc_grafica.svg', grSVG({ fg: 1 })); $('#gPng').onclick = () => dlPNG('guaitaCalc_grafica.png', grSVG({ fg: 1 }));

    const r = gp.getBoundingClientRect(), dx = (e.clientX - last.x) / r.width * 640 / 574 * (g.x1 - g.x0), dy = (e.clientY - last.y) / r.height * 360 / 314 * (g.y1 - g.y0);

  const up = e => { if (!P.has(e.pointerId)) return; P.delete(e.pointerId); pinch = 0; last = P.size ? [...P.values()][0] : null; if (!P.size) { save(); draw(); } };

// ===== guaitaCalc v0.5 · so de les tecles (Web Audio, sense fitxers) =====
let AC = null, NB = null;
function actx() { if (AC) return AC; try { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } catch {} return AC; }
function tone(c, at, f, d, type, g, to) { const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, at); if (to) o.frequency.exponentialRampToValueAtTime(to, at + d);

const SNDP = {

  mecanic: (c, a, k, g) => { noise(c, a, 0.022, 0.55 * g, 2600); tone(c, a, k === 'eq' ? 110 : 150, 0.04, 'sine', 0.5 * g, 70); },
  lcd: (c, a, k, g) => tone(c, a, k === 'eq' ? 3100 : k === 'c' ? 1500 : 2400, k === 'eq' ? 0.09 : 0.03, 'square', 0.13 * g),
